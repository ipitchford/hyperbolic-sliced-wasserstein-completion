# SPDX-License-Identifier: MIT
name: Replay
on:
  push:
  pull_request:
jobs:
  checks:
    name: Numerical sanity checks (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check MANIFEST.sha256
        run: sha256sum -c MANIFEST.sha256
      - name: Install packages
        run: python -m pip install -r requirements.txt
      - name: Both scripts on a copy, with and without -O (explicit checks exit non-zero on failure)
        run: |
          for F in "" "-O"; do
            if [ -z "$F" ]; then M=normal; else M=O; fi
            cp -R . "$RUNNER_TEMP/pkg_$M"
            (cd "$RUNNER_TEMP/pkg_$M" && python -I -B $F code/verify_and_plot.py > /dev/null && python -I -B $F code/verify_extensions.py --out "$RUNNER_TEMP/ext_$M" > /dev/null)
          done
      - name: Working tree unchanged
        run: test -z "$(git status --porcelain)"
